# Resolves expired hard claims hourly (replaces Render cron).
# Requires repo secrets — see DEPLOYMENT.md.

name: Resolve claims

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Target database
        required: true
        default: develop
        type: choice
        options:
          - develop
          - production

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: >-
        ${{
          (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
          || github.ref == 'refs/heads/main'
          ) && secrets.DATABASE_URL
          || (secrets.DATABASE_URL_DEVELOP || secrets.DATABASE_URL)
        }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Fix VIRTUAL_ENV for backend directory
        run: echo "VIRTUAL_ENV=${{ github.workspace }}/backend/.venv" >> $GITHUB_ENV

      - run: uv sync

      - name: Run resolve_claims
        run: uv run python manage.py resolve_claims
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: "false"
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          ADMIN_ADDRESSES: ${{ secrets.ADMIN_ADDRESSES }}
