# Runs update_and_notify on a schedule (replaces Render cron).
# Requires repo secrets — see DEPLOYMENT.md.

name: Update prices and notify

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [production, develop]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ matrix.environment == 'production' && secrets.DATABASE_URL || (secrets.DATABASE_URL_DEVELOP || secrets.DATABASE_URL) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.environment == 'production' && 'main' || 'develop' }}


      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Fix VIRTUAL_ENV for backend directory
        run: echo "VIRTUAL_ENV=${{ github.workspace }}/backend/.venv" >> $GITHUB_ENV

      - run: uv sync

      - name: Run migrations
        run: uv run python manage.py migrate --noinput
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: "false"

      - name: Run update_and_notify
        run: uv run python manage.py update_and_notify
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: "false"
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

