# Starter web (no spin-down, 2 workers x 4 threads), pinned to frankfurt/eu-central
# to co-locate with the Neon Postgres (also Frankfurt) AND sit close to Istanbul
# users (~30-50ms vs ~170-200ms to Oregon). DB RTT stays ~1ms.
# Postgres = Neon Frankfurt (DATABASE_URL). Crons = GitHub Actions (.github/workflows/).

envVarGroups:
  - name: verifi-common
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: verifi-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-app.vercel.app
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SECRET_KEY
        generateValue: true

services:
  - type: web
    name: verifi-backend
    runtime: python
    plan: starter
    region: frankfurt         # co-located with Neon Frankfurt + near Istanbul users
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "uv run gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --keep-alive 5"
    envVars:
      - fromGroup: verifi-common
      - key: DATABASE_URL
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: ADMIN_ADDRESSES
        sync: false
      - key: CLOUDINARY_URL
        sync: false
