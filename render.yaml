# $0 backend: free web only. Postgres = Neon/Supabase (DATABASE_URL).
# Crons = GitHub Actions (.github/workflows/).

envVarGroups:
  - name: verifi-common
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: verifi-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-app.vercel.app
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SECRET_KEY
        generateValue: true

services:
  - type: web
    name: verifi-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "uv run gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - fromGroup: verifi-common
      - key: DATABASE_URL
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: ADMIN_ADDRESSES
        sync: false
      - key: CLOUDINARY_URL
        sync: false
